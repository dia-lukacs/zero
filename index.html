<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zero</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Mono:wght@400&family=Inter:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="tokens/primitives.css" />
    <link rel="stylesheet" href="tokens/typography.css" />
    <link rel="stylesheet" href="tokens/semantic.css" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="components/date-picker.css" />
  </head>
  <body>
    <main class="page">
      <h1 class="page__title" aria-label="VONALAK">
        <span aria-hidden="true">V</span><span aria-hidden="true">O</span><span aria-hidden="true">N</span><span aria-hidden="true">A</span><span aria-hidden="true">L</span><span aria-hidden="true">A</span><span aria-hidden="true">K</span>
      </h1>
      <img class="page__stroke" src="assets/ink-stroke.jpg" width="4000" height="662" alt="" />
      <p class="page__subtitle">It’s only going to be a few sessions anyway.</p>
      <p class="page__body">Twelve years of skating.</p>
    </main>
    <section class="date-section" aria-label="Pick a date">
      <div class="date-picker" data-date-picker data-years="2010-2022" data-start="2016-03"></div>
    </section>
    <section class="date-section date-section--dark" aria-label="Pick a date, dark version">
      <div class="date-picker date-picker--dark" data-date-picker data-years="2010-2022" data-start="2016-04"></div>
    </section>
    <script src="components/date-picker.js"></script>
  </body>
</html>
